name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests
      run: go test -v ./internal/...
    
    - name: Run tests with coverage
      run: go test -coverprofile=coverage.out ./internal/...
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  gui:
    name: GUI (Wails v3, cmd/wails)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Wails v3 CLI
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.7

    - name: Generate bindings
      working-directory: cmd/wails
      run: |
        $env:Path = "$(go env GOPATH)\bin;$env:Path"
        wails3 generate bindings

    - name: Install frontend deps
      working-directory: cmd/wails/frontend
      run: npm ci

    - name: Frontend unit tests
      working-directory: cmd/wails/frontend
      run: npm test

    - name: Build frontend
      working-directory: cmd/wails/frontend
      run: npm run build

    - name: Build Go binary
      run: go build ./cmd/wails/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Build
      run: go build -v -o letsgo ./
    
    - name: Test binary
      run: ./letsgo --help

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        args: --timeout=5m

  build-matrix:
    name: Build Matrix
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    
    - name: Build Linux/Mac
      if: matrix.os != 'windows-latest'
      run: go build -v -o letsgo-${{ matrix.os }} ./
    
    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: go build -v -o letsgo.exe ./
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: letsgo-${{ matrix.os }}
        path: |
          letsgo*
