name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -v -o letsgo-${{ matrix.suffix }} ./
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: letsgo-${{ matrix.suffix }}
        path: letsgo-${{ matrix.suffix }}
        retention-days: 1

  release:
    name: Create Release
    needs: build-release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: letsgo-*
    
    - name: Display structure
      run: ls -R artifacts
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## Let's Go Code CLI ${{ github.ref_name }}
          
          ### Binaries
          - Linux (amd64, arm64)
          - Windows (amd64)
          - macOS (amd64, arm64)
          
          ### Installation
          Download the binary for your platform and add it to your PATH.
          
          ### Quick Start
          ```bash
          letsgo login
          letsgo chat
          ```
